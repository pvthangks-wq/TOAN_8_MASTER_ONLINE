services:
  app:
    build: .
    restart: unless-stopped
    environment:
      DB_PATH: /app/instance/toan8.db
      COOKIE_SECURE: '1'
      BOOTSTRAP_TOKEN: ${BOOTSTRAP_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
    volumes:
      - database:/app/instance
    expose:
      - '8000'
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  database:
  caddy_data:
  caddy_config:
